[package]
name = "rocks2d_physics"
version = "0.1.0"
edition = "2024"

[dependencies]
imgui = "0.12.0"
rand = "0.9.2"
raylib = { path = "external/raylib-rs/raylib", version = "5.7.0", features = ["wayland", "GLFW_BUILD_WAYLAND", "GLFW_BUILD_X11", "opengl_43"] }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "pendulumn"
harness = false
